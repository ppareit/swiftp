name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout SwiFTP repo
        uses: actions/checkout@v7

      # 21 matches the toolchain pinned in app/build.gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # assemble rather than build
      - name: Build
        run: ./gradlew assemble
