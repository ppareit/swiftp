import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Commit the beta build was made from, so About and the FTP welcome banner display it
def gitSha = ''
try {
    gitSha = providers.exec {
        commandLine 'git', 'describe', '--always', '--dirty', '--match=no-such-tag'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
    // No git, or an export without a checkout. The beta name just omits it.
}

android {

    compileSdk 36

    defaultConfig {
        applicationId "be.ppareit.swiftp"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 30300
        versionName "3.3.0"
    }
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions "default"
    productFlavors {
        playstore_paid {
            applicationId "be.ppareit.swiftp"
            dimension "default"
        }
        fdroid_free {
            applicationId "be.ppareit.swiftp_free"
            dimension "default"
        }
    }
    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Build handed to testers, uploaded by android.yml on every push
        beta {
            initWith debug
            applicationIdSuffix '.beta'
            versionNameSuffix gitSha.isEmpty() ? '-beta' : '-beta+' + gitSha
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pin the compiler rather than inheriting whatever JDK happens to be on PATH.
// Gradle locates a matching JDK, or downloads one via the resolver in settings.gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'net.vrallev.android:cat:1.0.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.fragment:fragment:1.8.9'

    // Tasker/Locale plugin support, Tasker install is optional
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'
}

android {
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }
    namespace = 'be.ppareit.swiftp'
    lint {
        baseline = file('lint-baseline.xml')
        disable 'GoogleAppIndexingWarning'
        disable 'MissingTranslation'
    }
}

tasks.register('runFdroid_freeDebug', Exec) {
    dependsOn 'installFdroid_freeDebug'
    commandLine android.adbExecutable, 'shell', 'am', 'start', '-n',
            'be.ppareit.swiftp_free/be.ppareit.swiftp.gui.MainActivity'
}

tasks.register('runPlaystore_paidDebug', Exec) {
    dependsOn 'installPlaystore_paidDebug'
    commandLine android.adbExecutable, 'shell', 'am', 'start', '-n',
            'be.ppareit.swiftp/be.ppareit.swiftp.gui.MainActivity'
}
